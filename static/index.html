<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,follow">
    <title>noScribe — Language</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.png" type="image/png">
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Source Serif 4", "Georgia", "Times New Roman", serif;
        background: radial-gradient(120% 120% at 10% 10%, #f5f1ea 0%, #efe7db 45%, #e8ded0 100%);
        color: #1d1d1d;
      }
      main {
        max-width: 36rem;
        padding: 2.5rem 2rem 2rem;
        margin: 2rem;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid #d9cfc1;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(29, 29, 29, 0.08);
        text-align: center;
      }
      h1 {
        font-size: 2rem;
        margin: 0 0 0.5rem;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0.5rem 0 0;
        font-size: 1.05rem;
        line-height: 1.5;
      }
      .choices {
        display: grid;
        gap: 0.75rem;
        margin: 1.5rem 0 0.75rem;
      }
      .lang {
        display: block;
        padding: 0.85rem 1rem;
        border: 1px solid #b9ab98;
        border-radius: 12px;
        text-decoration: none;
        color: inherit;
        font-weight: 600;
        background: #fff7eb;
        transition: transform 160ms ease, box-shadow 160ms ease;
      }
      .lang:hover,
      .lang:focus-visible {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(29, 29, 29, 0.12);
      }
      .meta {
        font-size: 0.9rem;
        color: #4b4b4b;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>noScribe</h1>
      <p>Select your language</p>
      <div class="choices">
        <a class="lang" href="/en/">English</a>
        <a class="lang" href="/de/">Deutsch</a>
      </div>
      <p class="meta">
        Your browser language is used for an automatic redirect on this page only.
        You can change language on every page later.
      </p>
      <noscript>
        <p class="meta">JavaScript is disabled; please choose a language above.</p>
      </noscript>
    </main>

    <script>
      (function () {
        if (window.location.pathname !== "/") return;

        // Add new languages by extending this map.
        var languagePaths = {
          en: "/en/",
          de: "/de/"
        };
        var fallback = "/en/";

        var preferred = (navigator.languages && navigator.languages.length)
          ? navigator.languages
          : [navigator.language || ""];

        var target = null;
        for (var i = 0; i < preferred.length; i++) {
          var lang = String(preferred[i] || "").toLowerCase();
          if (!lang) continue;
          if (languagePaths[lang]) {
            target = languagePaths[lang];
            break;
          }
          var base = lang.split("-")[0];
          if (languagePaths[base]) {
            target = languagePaths[base];
            break;
          }
        }

        if (!target) target = fallback;
        if (target && target !== window.location.pathname) {
          window.location.replace(target);
        }
      })();
    </script>
  </body>
</html>

baseURL = "https://noscribe.de/"

theme = "hugo-book"

defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false

languageCode = "de-DE"

title = "noScribe"

disableKinds = ["taxonomy"]

[pagination]
  pagerSize = 20

enableRobotsTXT = false

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  BookTheme = "auto"
  BookSearch = true
  BookServiceWorker = false
  BookSection = "docs"
  BookToC = false
  BookFavicon = "img/noScribeLogo.png"
  DefaultLang = "de"
  OgImage = "img/graphic_sw.png"
  siteDescription = "Privacy-first, offline transcription for interviews and research."

[languages]
  [languages.de]
    languageName = "Deutsch"
    languageCode = "de-DE"
    weight = 1
    title = "noScribe"

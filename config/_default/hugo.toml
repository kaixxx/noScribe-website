baseURL = "https://noscribe.de/"

theme = "hugo-book"

defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false

languageCode = "de-DE"

title = "noScribe"

disableKinds = ["taxonomy"]

[pagination]
  pagerSize = 20

enableRobotsTXT = false

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  BookTheme = "auto"
  BookSearch = true
  BookServiceWorker = false
  BookSection = "docs"
  BookToC = false
  BookFavicon = "img/noScribeLogo.png"
  DefaultLang = "de"
  OgImage = "img/graphic_sw.png"
  siteDescription = "Offizielle Website der Open-Source-Transkriptionssoftware noScribe – lokal, datenschutzfreundlich, ohne Cloud."
  authorName = "Dr. Kai Dröge"
  authorUrl = "https://github.com/kaixxx"
  authorSameAs = ["https://github.com/kaixxx"]
  codeRepository = "https://github.com/kaixxx/noScribe"
  licenseUrl = "https://www.gnu.org/licenses/gpl-3.0.html"

[languages]
  [languages.de]
    languageName = "Deutsch"
    languageCode = "de-DE"
    weight = 1
    title = "noScribe"
    contentDir = "content/de"
  [languages.en]
    languageName = "English"
    languageCode = "en-US"
    weight = 2
    title = "noScribe"
    contentDir = "content/en"

[languages.de.menu]
  [[languages.de.menu.before]]
    name = "Startseite"
    pageRef = "/"
    weight = 1

[languages.en.menu]
  [[languages.en.menu.before]]
    name = "Home"
    pageRef = "/"
    weight = 1

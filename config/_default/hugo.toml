baseURL = "https://noscribe.de/"

theme = "hugo-book"

defaultContentLanguage = "und"
defaultContentLanguageInSubdir = false
disableDefaultLanguageRedirect = true

languageCode = "en-US"

title = "noScribe"

disableKinds = ["taxonomy"]

[pagination]
  pagerSize = 20

enableRobotsTXT = false

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  BookTheme = "auto"
  BookSearch = true
  BookServiceWorker = false
  BookSection = "docs"
  BookToC = false
  BookFavicon = "img/noScribeLogo.png"
  DefaultLang = "en"
  OgImage = "img/graphic_sw.png"
  siteDescription = "Official project site of the open-source transcription software noScribe – local, privacy-friendly, no cloud."
  authorName = "Dr. Kai Dröge"
  authorUrl = "https://github.com/kaixxx"
  authorSameAs = ["https://github.com/kaixxx"]
  codeRepository = "https://github.com/kaixxx/noScribe"
  licenseUrl = "https://www.gnu.org/licenses/gpl-3.0.html"

[languages]
  [languages.und]
    languageName = "Language"
    languageCode = "und"
    weight = 0
    title = "noScribe"
    contentDir = "content/und"
  [languages.de]
    languageName = "Deutsch"
    languageCode = "de-DE"
    weight = 2
    title = "noScribe"
    contentDir = "content/de"
  [languages.en]
    languageName = "English"
    languageCode = "en-US"
    weight = 1
    title = "noScribe"
    contentDir = "content/en"
  [languages.fr]
    languageName = "Français"
    languageCode = "fr-FR"
    weight = 3
    title = "noScribe"
    contentDir = "content/fr"

[languages.de.params]
  siteDescription = "Offizielle Projektseite der Open-Source-Transkriptionssoftware noScribe – lokal, datenschutzfreundlich, ohne Cloud."

[languages.en.params]
  siteDescription = "Official project site of the open-source transcription software noScribe – local, privacy-friendly, no cloud."

[languages.fr.params]
  siteDescription = "Site officiel du logiciel open source de transcription noScribe – local, respectueux de la vie privée, sans cloud."

[languages.de.menu]
  [[languages.de.menu.before]]
    name = "Startseite"
    pageRef = "/"
    weight = 1

[languages.en.menu]
  [[languages.en.menu.before]]
    name = "Home"
    pageRef = "/"
    weight = 1

[languages.fr.menu]
  [[languages.fr.menu.before]]
    name = "Accueil"
    pageRef = "/"
    weight = 1

baseURL = "https://noscribe.de/"

theme = "hugo-book"

defaultContentLanguage = "und"
defaultContentLanguageInSubdir = false
disableDefaultLanguageRedirect = true

languageCode = "en"

title = "noScribe"

disableKinds = ["taxonomy"]

[pagination]
  pagerSize = 20

enableRobotsTXT = false

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  BookTheme = "auto"
  BookSearch = true
  BookServiceWorker = false
  BookSection = "docs"
  BookToC = false
  BookFavicon = "img/noScribeLogo.png"
  DefaultLang = "en"
  OgImage = "img/graphic_sw.png"
  siteDescription = "Official project site of the open-source transcription software noScribe – local, privacy-friendly, no cloud."
  authorName = "Dr. Kai Dröge"
  authorUrl = "https://github.com/kaixxx"
  authorSameAs = ["https://github.com/kaixxx"]
  codeRepository = "https://github.com/kaixxx/noScribe"
  licenseUrl = "https://www.gnu.org/licenses/gpl-3.0.html"

[languages]
  [languages.und]
    languageName = "Language"
    languageCode = "und"
    weight = 0
    title = "noScribe"
    contentDir = "content/und"
  [languages.de]
    languageName = "Deutsch"
    languageCode = "de"
    weight = 2
    title = "noScribe"
    contentDir = "content/de"
  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 1
    title = "noScribe"
    contentDir = "content/en"
  [languages.fr]
    languageName = "Français"
    languageCode = "fr"
    weight = 3
    title = "noScribe"
    contentDir = "content/fr"
  [languages.es]
    languageName = "Español"
    languageCode = "es"
    weight = 4
    title = "noScribe"
    contentDir = "content/es"
  [languages.it]
    languageName = "Italiano"
    languageCode = "it"
    weight = 5
    title = "noScribe"
    contentDir = "content/it"
  [languages.nl]
    languageName = "Nederlands"
    languageCode = "nl"
    weight = 6
    title = "noScribe"
    contentDir = "content/nl"

[languages.de.params]
  ogLocale = "de_DE"
  siteDescription = "Offizielle Projektseite der Open-Source-Transkriptionssoftware noScribe – lokal, datenschutzfreundlich, ohne Cloud."

[languages.en.params]
  ogLocale = "en_US"
  siteDescription = "Official project site of the open-source transcription software noScribe – local, privacy-friendly, no cloud."

[languages.fr.params]
  ogLocale = "fr_FR"
  siteDescription = "Site officiel du logiciel open source de transcription noScribe – local, respectueux de la vie privée, sans cloud."

[languages.es.params]
  ogLocale = "es_ES"
  siteDescription = "Sitio oficial del software de transcripción de código abierto noScribe – local, respetuoso con la privacidad, sin nube."

[languages.it.params]
  ogLocale = "it_IT"
  siteDescription = "Sito ufficiale del software di trascrizione open-source noScribe – locale, rispettoso della privacy, senza cloud."

[languages.nl.params]
  ogLocale = "nl_NL"
  siteDescription = "Officiele projectsite van de open-source transcriptiesoftware noScribe – lokaal, privacyvriendelijk, zonder cloud."

